  --c-assumption: #9085e9; --c-threat: #d55181; --c-risk: #3987e5; --c-rmi: #199e70; --c-group: #d95926; --c-component: #898781;

}
* { box-sizing: border-box; }

.ico { flex: none; display: block; }

.count { font: 600 11.5px/1 var(--font); color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 3px 7px; font-variant-numeric: tabular-nums; }

/* colour hooks */
.lvl-low { --lvl: var(--low); --lvl-ink: #fff; } .lvl-medium { --lvl: var(--medium); --lvl-ink: #0b0b0b; } .lvl-high { --lvl: var(--high); --lvl-ink: #fff; } .lvl-none { --lvl: var(--surface-3); --lvl-ink: var(--text-2); }
.t-assumption { --tc: var(--c-assumption); } .t-threat { --tc: var(--c-threat); } .t-risk { --tc: var(--c-risk); } .t-rmi { --tc: var(--c-rmi); } .t-group { --tc: var(--c-group); } .t-component { --tc: var(--c-component); }
.cat-format { --ic: var(--i-format); } .cat-consistency { --ic: var(--i-consistency); } .cat-warning { --ic: var(--i-warning); }

/* ---------- shell ---------- */
#app { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; margin-right: 8px; white-space: nowrap; }
.logo-bg { fill: var(--text); } .logo-l { fill: none; stroke: var(--surface); stroke-width: 1.4; opacity: .7; } .logo-n { stroke: var(--text); stroke-width: 1; }
.logo-n.n1 { fill: var(--c-threat); } .logo-n.n2 { fill: var(--c-risk); } .logo-n.n3 { fill: var(--c-rmi); }
.filechip { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); max-width: 360px; white-space: nowrap; overflow: hidden; }
.filechip:hover { border-color: var(--border-2); } .fname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; } .filechip .muted { font-size: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 8px; font-weight: 550; white-space: nowrap; border: 1px solid var(--border-2); background: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); } .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12.5px; border-radius: 7px; }
#reload-btn.changed { color: var(--text); background: color-mix(in srgb, var(--medium) 24%, var(--surface)); }
#reload-btn.changed::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--i-warning); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--text-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); } .icon-btn.sm { width: 24px; height: 24px; border-radius: 6px; }
.search { position: relative; flex: 0 1 340px; min-width: 160px; margin-left: 6px; }
.searchbox { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); }
.searchbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.searchbox input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; color: var(--text); }
.search-res { position: absolute; top: 38px; left: 0; width: min(560px, 80vw); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 30; }
.search-h { display: flex; gap: 8px; align-items: center; font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px 8px 4px; }
.search-i { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 7px; } .search-i:hover, .search-i:focus-visible { background: var(--surface-2); }
.search-i .ico { color: var(--tc); } .search-t { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.counters { display: flex; gap: 4px; margin-right: 4px; }
.counter { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 9px; border-radius: 8px; background: color-mix(in srgb, var(--ic) 14%, var(--surface)); color: color-mix(in srgb, var(--ic) 72%, var(--text)); font-variant-numeric: tabular-nums; }
.counter:hover { background: color-mix(in srgb, var(--ic) 24%, var(--surface)); } .counter.zero { background: var(--surface-2); color: var(--muted); }
.layout { flex: 1; display: flex; min-height: 0; }
.sidebar { width: 226px; flex: none; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--border); overflow: auto; }
.nav-i { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--text-2); font-weight: 550; border: 1px solid transparent; }
.nav-i:hover { background: var(--surface-2); color: var(--text); }

.nav-i > span:first-of-type { flex: 1; white-space: nowrap; } .nav-i .count { background: transparent; color: var(--muted); padding: 0; }
.sidebar-foot { margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); padding: 10px; }
main { flex: 1; min-width: 0; overflow: auto; outline: none; }
.view { padding: 22px 26px 60px; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.view-head { display: flex; align-items: flex-end; gap: 16px; } .view-head > div:first-child { flex: 1; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.015em; } .view-sub { color: var(--text-2); margin-top: 3px; max-width: 92ch; }
h2 { font-size: 14.5px; font-weight: 650; } h3 { font-size: 13px; font-weight: 650; }
.list-title { display: flex; align-items: center; gap: 8px; margin-top: 8px; } .list-info { color: var(--muted); font-size: 12.5px; }
body.busy #app { opacity: .6; pointer-events: none; }
body.dragging::after { content: "Drop the workbook to open it (read-only)"; position: fixed; inset: 10px; display: grid; place-items: center; font-size: 18px; font-weight: 600; border: 2px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--accent) 10%, var(--bg)); z-index: 99; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .03); }
.box { padding: 16px 18px 18px; min-width: 0; }
.box-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; } .box-head > div:first-child { flex: 1; min-width: 0; } .box-head p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.grid12 > * { grid-column: span 12; } .span4 { grid-column: span 4 !important; } .span6 { grid-column: span 6 !important; } .span8 { grid-column: span 8 !important; } .hero { grid-column: span 4 !important; }
@media (max-width: 1180px) { .span4, .span6, .span8, .hero { grid-column: span 12 !important; } }
.note { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; } .note > .ico { margin-top: 0; }
.legend { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); align-items: center; }
.legend-i { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 11px; height: 11px; border-radius: 3px; background: var(--lvl); display: inline-block; flex: none; }
.empty { padding: 34px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--border-2); border-radius: 12px; } .empty-t { font-weight: 600; color: var(--text-2); }

/* ---------- atoms ---------- */
.pill { display: inline-grid; place-items: center; min-width: 30px; height: 21px; padding: 0 6px; border-radius: 6px; background: var(--lvl); color: var(--lvl-ink); font: 650 12px/1 var(--font); font-variant-numeric: tabular-nums; }
.pill.lvl-none { background: transparent; box-shadow: inset 0 0 0 1px var(--border-2); color: var(--muted); }
.pill-pair { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); flex: none; }
.assumed .pill { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--border-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; max-width: 100%; padding: 0 8px 0 7px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; vertical-align: middle; }
button.chip:hover { border-color: color-mix(in srgb, var(--tc) 60%, var(--border-2)); background: color-mix(in srgb, var(--tc) 8%, var(--surface)); }
.chip .ico { color: var(--tc); } .chip-id { font: 600 12px/1 var(--mono); white-space: nowrap; } .t-component .chip-id { font-family: var(--font); font-size: 12.5px; }
.chip-label { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .chip.plain { color: var(--text-2); background: var(--surface-2); border-color: transparent; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; } .chips.col { display: flex; flex-direction: column; align-items: flex-start; }
.tag { display: inline-flex; align-items: center; height: 21px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 550; white-space: nowrap; background: var(--surface-2); color: var(--text-2); }
.tag.pending { background: transparent; border: 1px dashed var(--border-2); color: var(--muted); }
.tag.bad { background: color-mix(in srgb, var(--i-consistency) 13%, var(--surface)); color: color-mix(in srgb, var(--i-consistency) 75%, var(--text)); }
.cia { display: inline-flex; gap: 3px; vertical-align: middle; }
.cia-b { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 5px; font: 650 11px/1 var(--font); color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); opacity: .55; }
.cia-b.on { background: var(--text-2); color: var(--surface); box-shadow: none; opacity: 1; }
.ibadges { display: inline-flex; gap: 4px; flex: none; }
.ibadge { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 6px; background: color-mix(in srgb, var(--ic) 16%, var(--surface)); color: color-mix(in srgb, var(--ic) 76%, var(--text)); font: 650 11px/1 var(--font); flex: none; }
button.ibadge:hover { background: color-mix(in srgb, var(--ic) 28%, var(--surface)); }
.lbar { display: flex; gap: 2px; height: 8px; min-width: 70px; flex: 1; } .lbar-seg { background: var(--lvl); border-radius: 4px; min-width: 4px; flex-basis: 0; }
.lbar.tall { height: 28px; } .lbar.tall .lbar-seg { border-radius: 4px; color: var(--lvl-ink); font: 650 12.5px/28px var(--font); padding: 0 8px; text-align: left; overflow: hidden; }
button.lbar-seg:hover { filter: brightness(1.08); }
.validity { display: inline-flex; align-items: center; gap: 4px; font-weight: 550; } .validity.yes { color: color-mix(in srgb, var(--low) 70%, var(--text)); } .validity.no { color: var(--muted); }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-2); border-radius: 9px; flex-wrap: wrap; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; color: var(--text-2); font-weight: 550; font-size: 13px; white-space: nowrap; }
.seg button:hover { color: var(--text); } .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.seg.multi button .ico { color: var(--muted); } .seg.multi button.on .ico { color: var(--tc); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.ctl { display: flex; align-items: center; gap: 8px; } .ctl.grow { flex: 1; } .ctl-l { font-size: 12px; color: var(--muted); font-weight: 550; }
.controls .searchbox { width: 250px; }
.sel { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 12.5px; }
.sel > span { color: var(--muted); } .sel select { border: 0; background: transparent; outline: 0; max-width: 170px; font-weight: 550; height: 28px; }
.sel.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.focusbar { padding: 4px 6px 4px 10px; border: 1px solid var(--accent); border-radius: 9px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.more { color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 6px 4px; }

/* ---------- object cards ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.obj { overflow: hidden; } .obj.open { border-color: var(--border-2); box-shadow: var(--shadow); }
.obj-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; min-height: 52px; }
.obj-head:hover { background: color-mix(in srgb, var(--tc) 5%, var(--surface)); }
.obj-chev { color: var(--muted); transition: transform .15s; flex: none; } .obj.open .obj-chev, details[open] > summary > .ico:first-child { transform: rotate(90deg); }
.obj-ico { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: color-mix(in srgb, var(--tc) 14%, var(--surface)); color: color-mix(in srgb, var(--tc) 82%, var(--text)); flex: none; }
.obj-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.obj-line { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.obj-id { font: 650 12.5px/1.3 var(--mono); white-space: nowrap; flex: none; } .t-component .obj-id { font-family: var(--font); font-size: 14px; }
.obj-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); } .obj.open .obj-title { white-space: normal; }
.obj-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: var(--text-2); }
.obj-meta .lbar { flex: 0 0 90px; }
.meta-comp, .meta-n { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; } .meta-comp .ico, .meta-n .ico { color: var(--muted); }
.obj-side { display: flex; align-items: center; gap: 8px; flex: none; align-self: flex-start; min-height: 30px; }
.obj-body { display: none; padding: 4px 16px 16px 60px; border-top: 1px solid var(--border); } .obj.open .obj-body { display: block; }
.grp { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.grp-head { display: flex; align-items: center; gap: 10px; padding: 4px 2px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.grp-title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .grp-r { margin-left: auto; display: flex; align-items: center; gap: 5px; color: var(--muted); } .grp-r .lbar { width: 110px; flex: none; margin-right: 6px; }

/* ---------- detail ---------- */
.detail { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }
.lead { font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; } .text { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); }
.fields { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 9px 14px; align-items: start; }
.field { display: contents; } .field-l { color: var(--muted); font-size: 12.5px; padding-top: 2px; } .field-v { min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sec { border-top: 1px solid var(--border); padding-top: 10px; }
.sec > summary, .igroup > summary, .expect > summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-weight: 650; }
summary::-webkit-details-marker { display: none; } summary > .ico:first-child { color: var(--muted); transition: transform .15s; }
.sec-note { font-weight: 400; font-size: 12px; color: var(--muted); } .sec-b { padding: 10px 0 2px 20px; }
.source { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.assess-wrap { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
.assess { border-collapse: collapse; font-size: 13px; flex: 1; min-width: 300px; } .assess th, .assess td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--border); font-weight: 400; }
.assess thead th { font-size: 12px; color: var(--muted); font-weight: 550; } .assess tbody th { color: var(--muted); font-size: 12.5px; white-space: nowrap; } .assess tr:last-child > * { border-bottom: 0; }
.mini-wrap { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.mini-mx { display: grid; grid-template-columns: repeat(4, 22px); grid-auto-rows: 22px; gap: 2px; }
.mini-c { position: relative; border-radius: 4px; background: color-mix(in srgb, var(--lvl) 26%, var(--surface)); display: grid; place-items: center; }
.mk { width: 10px; height: 10px; border-radius: 50%; display: inline-block; position: absolute; } .mini-leg .mk { position: static; }
.mk.before { box-shadow: inset 0 0 0 2px var(--text); } .mk.after { background: var(--text); width: 6px; height: 6px; } .mini-leg .mk.after { margin: 0 2px; }
.mini-leg { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); } .mini-leg span { display: inline-flex; align-items: center; gap: 4px; }
.treat-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.items { display: flex; flex-direction: column; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--border); } .item:first-child { border-top: 0; }
.item-text { flex: 1; min-width: 0; text-align: left; overflow-wrap: anywhere; padding-left: 14px; position: relative; } .item-text::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--c-rmi); }
.item-text:hover { color: var(--accent); } .item-id { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); margin-right: 7px; } .item-side { display: flex; align-items: center; gap: 6px; flex: none; }
.subhead { font-size: 12px; font-weight: 650; color: var(--muted); margin-top: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; } .stat { display: flex; flex-direction: column; gap: 3px; min-width: 110px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); font-size: 12px; color: var(--text-2); } .stat b { font-size: 18px; color: var(--text); font-weight: 650; display: flex; align-items: center; min-height: 26px; }
.variants li { margin-bottom: 4px; }
code.excerpt { display: block; font: 12px/1.45 var(--mono); background: var(--surface-2); border-radius: 6px; padding: 5px 8px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); }
.rrows { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.rrow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--border); min-width: 0; } .rrow:first-child { border-top: 0; } .rrow:hover { background: var(--surface-2); }
.rrow-id { font: 650 12px/1 var(--mono); white-space: nowrap; flex: none; min-width: 74px; } .rrow-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); } .rrow-extra { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.issues { display: flex; flex-direction: column; gap: 8px; }
.issue { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 10px; background: color-mix(in srgb, var(--ic) 5%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ic) 22%, var(--border)); }
.issue-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; } .issue-msg { overflow-wrap: anywhere; } .issue-hint { font-size: 12.5px; color: var(--text-2); }
.issue-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; } .loc { display: inline-flex; align-items: center; gap: 5px; font: 550 12px/1 var(--font); color: var(--text-2); background: var(--surface-2); border-radius: 6px; padding: 5px 7px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .22); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 94vw); background: var(--surface); border-left: 1px solid var(--border-2); box-shadow: -12px 0 40px rgba(0, 0, 0, .16); z-index: 41; display: flex; flex-direction: column; animation: slide .16s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.dr-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.dr-title { flex: 1; min-width: 0; display: flex; flex-direction: column; } .dr-type { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.dr-id { font: 650 15px/1.3 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .dr-id.plain, .t-component .dr-id { font-family: var(--font); }
.dr-body { flex: 1; overflow: auto; padding: 4px 18px 30px; }
.tooltip { position: fixed; z-index: 100; max-width: 380px; padding: 7px 10px; border-radius: 8px; background: #1d1d1b; color: #f3f2ee; font-size: 12.5px; line-height: 1.4; white-space: pre-line; overflow-wrap: anywhere; pointer-events: none; opacity: 0; visibility: hidden; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); left: 0; top: 0; }
.tooltip.on { opacity: 1; visibility: visible; } :root[data-theme="dark"] .tooltip { background: #f0efec; color: #121211; }

/* ---------- overview ---------- */
.hero { display: flex; flex-direction: column; gap: 12px; } .hero-l { color: var(--text-2); font-weight: 550; }
.hero-row { display: flex; align-items: flex-end; gap: 14px; } .hero-v { font-size: 60px; font-weight: 650; line-height: .95; letter-spacing: -.03em; } .hero-d { display: flex; flex-direction: column; color: var(--muted); font-size: 12.5px; padding-bottom: 4px; }
.hero-stats { display: flex; gap: 22px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: auto; } .hero-stats div { display: flex; flex-direction: column; } .hero-stats b { font-size: 18px; font-weight: 650; } .hero-stats span { font-size: 12px; color: var(--muted); }
.prof-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; } .prof-l { flex: 0 0 112px; font-size: 12.5px; color: var(--text-2); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; } @media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpi { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 13px 14px; align-items: center; text-align: left; } .kpi:hover { border-color: color-mix(in srgb, var(--tc) 55%, var(--border-2)); }
.kpi-ico { grid-row: span 2; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--tc) 14%, var(--surface)); color: color-mix(in srgb, var(--tc) 82%, var(--text)); }
.kpi-v { font-size: 22px; font-weight: 650; line-height: 1.1; } .kpi-l { font-size: 12.5px; color: var(--text-2); font-weight: 550; } .kpi-s { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: 5px; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 10px; padding: 5px 6px; border-radius: 7px; width: 100%; } button.bar-row:hover { background: var(--surface-2); }
.wide-labels .bar-row { grid-template-columns: minmax(150px, 300px) minmax(0, 1fr); }
.bar-l { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bar-l b { font: 650 12px/1 var(--mono); color: var(--text); }
.bar-track { display: flex; align-items: center; gap: 8px; } .bar-fill { height: 12px; min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0; flex-grow: 0; flex-shrink: 0; } .bar-v { font-weight: 650; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cmx-pair { display: flex; align-items: center; gap: 14px; justify-content: space-around; flex-wrap: wrap; } .cmx-t { font-size: 12.5px; font-weight: 600; color: var(--text-2); margin: 0 0 8px 83px; } .cmx-t.no-y { margin-left: 0; } .cmx-arrow { color: var(--muted); }
.cmx { display: grid; grid-template-columns: 80px repeat(4, 52px); grid-template-rows: repeat(4, 34px) auto; gap: 3px; align-items: center; } .cmx.no-y { grid-template-columns: repeat(4, 52px); }
.cmx-y, .cmx-x { font-size: 10.5px; color: var(--muted); line-height: 1.15; } .cmx-y { text-align: right; padding-right: 6px; } .cmx-x { text-align: center; align-self: start; padding-top: 3px; }
.cmx-c { height: 100%; border-radius: 6px; background: color-mix(in srgb, var(--lvl) 30%, var(--surface)); display: grid; place-items: center; font-weight: 650; font-variant-numeric: tabular-nums; } .cmx-c.zero { background: color-mix(in srgb, var(--lvl) 11%, var(--surface)); } .cmx-c:hover { outline: 2px solid var(--border-2); }
.meter-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; } .meter-head b { font-size: 26px; font-weight: 650; }
.meter { height: 10px; border-radius: 5px; background: var(--accent-soft); overflow: hidden; margin-bottom: 12px; } .meter span { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.q-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.q-tile { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 12px; border-radius: 10px; border: 1px solid var(--border); text-align: left; } .q-tile:hover { border-color: color-mix(in srgb, var(--ic) 50%, var(--border-2)); }
.q-tile .ibadge { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; } .q-tile b { font-size: 20px; font-weight: 650; line-height: 1.1; } .q-tile > span:last-of-type { font-size: 12.5px; color: var(--text-2); }
.q-tiles.big .q-tile { background: var(--surface); padding: 14px; } .q-tile small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: 6px; } .q-tile.on { border-color: var(--ic); box-shadow: inset 0 0 0 1px var(--ic); background: color-mix(in srgb, var(--ic) 6%, var(--surface)); }
.comp-rows { display: flex; flex-direction: column; } .comp-row { display: grid; grid-template-columns: minmax(110px, 190px) 1fr auto auto; align-items: center; gap: 12px; padding: 7px 6px; border-radius: 7px; } .comp-row:hover { background: var(--surface-2); } .comp-n { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- matrix ---------- */
.mx-row { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); } .mx-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } @media (max-width: 1560px) { .mx-row.two { grid-template-columns: minmax(0, 1fr); } }
.mx { display: grid; grid-template-columns: 18px 84px repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(104px, auto)) auto auto; gap: 4px; }
.mx-ytitle { grid-column: 1; grid-row: 1 / span 4; display: grid; place-items: center; } .mx-ytitle span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.mx-ylab { grid-column: 2; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right; padding-right: 8px; font-size: 12px; line-height: 1.25; } .mx-ylab span, .mx-xlab span { color: var(--muted); font-size: 11px; }
.mx-xlab { grid-row: 5; display: flex; flex-direction: column; align-items: center; font-size: 12px; padding-top: 3px; } .mx-xtitle { grid-row: 6; grid-column: 3 / span 4; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; padding-top: 2px; }
.mx-cell { border-radius: 8px; padding: 6px 7px 8px; background: color-mix(in srgb, var(--lvl) 13%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lvl) 26%, transparent); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mx-cell-head { display: flex; justify-content: space-between; align-items: center; min-height: 18px; }
.mx-count { font-size: 11.5px; font-weight: 650; color: var(--text-2); border-radius: 5px; padding: 1px 4px; margin-left: -4px; } .mx-count:hover { background: color-mix(in srgb, var(--lvl) 30%, var(--surface)); }
.mx-val { font: 650 11px/1 var(--font); font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--lvl) 55%, var(--text)); padding: 3px 5px; border-radius: 5px; background: color-mix(in srgb, var(--lvl) 22%, var(--surface)); }
.mx-chips { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
.mchip { font: 600 10.5px/1 var(--mono); padding: 4px 5px; border-radius: 5px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-2); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; transition: opacity .1s; }
.mchip:hover, .mchip.hl { box-shadow: inset 0 0 0 2px var(--text); } .mchip.th { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-threat) 60%, var(--border-2)); } .mchip.th:hover, .mchip.th.hl { box-shadow: inset 0 0 0 2px var(--text); }
.idot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--surface); } .idot.err { background: var(--i-consistency); } .idot.warn { background: var(--medium); }
.mchip { position: relative; }
.mchip-n { color: var(--muted); font-family: var(--font); } .mchip.more { background: transparent; color: var(--text-2); }
.mx-row.hovering .mchip:not(.hl) { opacity: .28; }
.mv-wrap { position: relative; } .mv-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.mv-num { display: flex; align-items: baseline; gap: 5px; color: var(--muted); } .mv-b { font-size: 13px; font-weight: 600; } .mv-a { font-size: 19px; font-weight: 650; color: var(--text); line-height: 1; } .mv-num .ico { align-self: center; }
.mv-hub { flex: 1; display: grid; place-items: center; min-height: 30px; }
.mv-anchor { width: 9px; height: 9px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1.5px var(--text-2); } .mv-anchor.idle { opacity: .25; }
.mv-stay { font-size: 11.5px; color: var(--text-2); border-radius: 5px; padding: 1px 5px; margin-left: -5px; align-self: flex-start; min-height: 18px; position: relative; z-index: 3; } button.mv-stay:hover { background: var(--surface); }
.mv-arrow { pointer-events: auto; cursor: pointer; color: var(--text-2); } .mv-arrow.worse { color: var(--high); }
.mv-line { fill: none; stroke: currentColor; stroke-linecap: round; opacity: .55; } .mv-head { fill: currentColor; opacity: .8; } .mv-hit { fill: none; stroke: transparent; stroke-width: 18; }
.mv-dot { fill: var(--surface); stroke: currentColor; stroke-width: 1.5; } .mv-txt { font: 650 11px var(--font); fill: var(--text); }
.mv-arrow:hover .mv-line, .mv-arrow:focus-visible .mv-line { opacity: 1; } .mv-arrow:hover { color: var(--text); } .mv-arrow.worse:hover { color: var(--high); }

/* ---------- threats ---------- */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 6px; margin-bottom: 14px; }
.ttile { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); min-height: 78px; text-align: left; }
.ttile-n { font: 650 12px/1.2 var(--mono); } .ttile-t { font-size: 12px; color: var(--text-2); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ttile-f { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; padding-top: 4px; } .ttile-f .pill { height: 18px; min-width: 24px; font-size: 11px; }
.ttile.used { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); } .ttile.used:hover { border-color: var(--accent); }
.ttile.listed { border-style: solid; border-color: var(--border-2); } .ttile.absent { border-style: dashed; opacity: .62; } .ttile.absent .ttile-n { color: var(--muted); }
.sw.tt-used { background: color-mix(in srgb, var(--accent) 30%, var(--surface)); box-shadow: inset 0 0 0 1px var(--accent); } .sw.tt-listed { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-2); } .sw.tt-absent { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); opacity: .6; }

/* ---------- components ---------- */
.heat-scroll { overflow: auto; margin-bottom: 12px; } .heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.heat th { font-weight: 550; } .heat-corner { text-align: left; color: var(--muted); font-size: 11.5px; font-weight: 400; vertical-align: bottom; padding: 0 8px 4px 0; }
.heat-col { vertical-align: bottom; padding-bottom: 4px; } .heat-col button { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 11px/1 var(--mono); color: var(--text-2); padding: 4px 2px; border-radius: 5px; white-space: nowrap; } .heat-col button:hover, .heat-row button:hover { background: var(--surface-2); color: var(--text); }
.heat-row { text-align: right; padding-right: 6px; white-space: nowrap; position: sticky; left: 0; background: var(--surface); z-index: 1; } .heat-row button { padding: 4px 6px; border-radius: 6px; font-weight: 550; }
.heat td { padding: 0; } .heat-c { width: 30px; height: 28px; border-radius: 6px; background: color-mix(in srgb, var(--lvl) 78%, var(--surface)); color: var(--lvl-ink); font-weight: 650; font-variant-numeric: tabular-nums; display: grid; place-items: center; } .heat-c:hover { outline: 2px solid var(--text); }
.heat-0 { display: block; width: 30px; height: 28px; border-radius: 6px; background: var(--surface-2); opacity: .55; } .heat-sum { padding-left: 10px !important; color: var(--muted); font-size: 11.5px; font-weight: 400 !important; vertical-align: bottom; }
.comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.comp-card { display: flex; flex-direction: column; gap: 10px; padding: 14px; text-align: left; } .comp-card:hover { border-color: var(--border-2); box-shadow: var(--shadow); }
.comp-card-h { display: flex; align-items: center; gap: 10px; } .comp-card-h b { flex: 1; font-size: 14.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp-card-s, .comp-card-c { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-2); } .comp-card-b { display: flex; align-items: center; gap: 10px; } .comp-card-b .prof-l { flex: 0 0 44px; } .comp-card-c b { color: var(--text); }

/* ---------- connections ---------- */
.flow-host { display: flex; flex-direction: column; gap: 12px; } .flow-wrap { position: relative; padding: 4px 0 10px; }
.flow { display: grid; column-gap: 84px; align-items: start; position: relative; z-index: 1; }
.flow-svg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; overflow: visible; }
.flow-col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.flow-col-h { display: flex; align-items: center; gap: 7px; font-weight: 650; font-size: 12.5px; padding: 2px 2px 8px; position: sticky; top: 0; background: var(--bg); z-index: 3; } .flow-col-h .ico { color: var(--tc); }
.fnode { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--tc); min-width: 0; font-size: 12.5px; transition: opacity .1s; }
.fnode .ico { color: var(--tc); } .fnode-id { font: 650 11.5px/1 var(--mono); white-space: nowrap; flex: none; } .t-component .fnode-id { font: 600 12.5px/1 var(--font); overflow: hidden; text-overflow: ellipsis; flex: 1; }
.fnode-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); } .fnode .pill { height: 18px; min-width: 24px; font-size: 11px; }
.fnode-err { width: 7px; height: 7px; border-radius: 50%; background: var(--i-consistency); flex: none; }
.fnode:hover, .fnode.hl { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 9%, var(--surface)); } .fnode.focus { box-shadow: 0 0 0 2px var(--tc); }
.flow-wrap.hovering .fnode:not(.hl) { opacity: .3; }
.edge { fill: none; stroke: var(--text-2); opacity: .22; } .edge.warn { stroke: var(--i-consistency); stroke-dasharray: 4 3; opacity: .7; } .edge.hl { opacity: .95; stroke: var(--text); } .edge.warn.hl { stroke: var(--i-consistency); }
.flow-wrap.hovering .edge:not(.hl) { opacity: .07; }
.edge-key { display: inline-block; width: 22px; border-top: 2px dashed var(--i-consistency); margin: 0 2px; }

/* ---------- issues ---------- */
.igroup { padding: 0; overflow: hidden; } .igroup > summary { padding: 11px 14px; flex-wrap: wrap; font-weight: 400; } .igroup > summary:hover { background: var(--surface-2); }
.igroup-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); } .igroup-t.strong { color: var(--text); font-weight: 650; }
.igroup-s { flex-basis: 100%; font-size: 12.5px; color: var(--muted); padding-left: 20px; } .igroup > .sec-b { padding: 4px 14px 14px 34px; }

/* ---------- welcome, dialogs, toasts ---------- */
.welcome { min-height: 100%; display: flex; flex-direction: column; padding: 14px; } .welcome-top { display: flex; }
.welcome-card { margin: auto; width: min(620px, 100%); display: flex; flex-direction: column; gap: 22px; padding: 10px 0 60px; }
.welcome-brand { display: flex; align-items: center; gap: 16px; } .welcome-brand h1 { font-size: 26px; } .welcome-brand p { color: var(--text-2); margin-top: 2px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 38px 20px; border: 1.5px dashed var(--border-2); border-radius: 16px; background: var(--surface); text-align: center; transition: border-color .15s, background .15s; }
.drop:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); } .drop b { font-size: 16px; } .drop span { color: var(--muted); }
.drop-ico { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; background: color-mix(in srgb, var(--accent) 13%, var(--surface)); color: var(--accent); margin-bottom: 6px; }
.promises { display: flex; flex-direction: column; gap: 12px; } .promises li { display: flex; gap: 12px; align-items: flex-start; } .promises .ico { margin-top: 3px; color: var(--text-2); } .promises div { display: flex; flex-direction: column; } .promises span { color: var(--text-2); font-size: 13px; }
.expect { border-top: 1px solid var(--border); padding-top: 14px; color: var(--text-2); font-size: 13px; } .expect ul { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 10px 20px; } .expect b { color: var(--text); }
.dialog { border: 1px solid var(--border-2); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); width: min(560px, 92vw); max-height: 86vh; box-shadow: 0 24px 80px rgba(0, 0, 0, .3); } .dialog.wide { width: min(880px, 94vw); }
.dialog::backdrop { background: rgba(0, 0, 0, .35); } .dialog[open] { display: flex; flex-direction: column; }
.dialog > header { display: flex; align-items: center; padding: 14px 16px 12px 20px; border-bottom: 1px solid var(--border); } .dialog > header h2 { flex: 1; font-size: 16px; }
.dialog-b { padding: 18px 20px 22px; overflow: auto; display: flex; flex-direction: column; gap: 14px; } .dialog-b > div { display: flex; flex-direction: column; gap: 14px; }
.method ul { list-style: disc; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--text-2); } .method h3 { margin-top: 6px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; } .tbl th, .tbl td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--border); vertical-align: top; } .tbl th { font-size: 12px; color: var(--muted); font-weight: 550; } .tbl tr.muted td { color: var(--muted); }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 200; width: min(620px, 92vw); }
.toast { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px 11px 14px; border-radius: 11px; background: var(--surface); border: 1px solid var(--border-2); box-shadow: var(--shadow); } .toast span { flex: 1; } .toast > .ico { margin-top: 2px; color: var(--accent); }
.toast.error { border-color: color-mix(in srgb, var(--i-consistency) 55%, var(--border)); } .toast.error > .ico { color: var(--i-consistency); }
@media (max-width: 900px) { .sidebar { width: 56px; } .nav-i span, .sidebar-foot { display: none; } .view { padding: 16px; } .brand span, .filechip .muted { display: none; } }
@media print { .topbar, .sidebar, #drawer, .controls { display: none !important; } main { overflow: visible; } }

/* ---------- write mode ---------- */
.btn.write-on { background: color-mix(in srgb, var(--medium) 26%, var(--surface)); border-color: var(--i-warning); color: var(--text); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.fieldbox { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text-2); }
.fieldbox input { height: 36px; border: 1px solid var(--border-2); border-radius: 8px; padding: 0 10px; background: var(--surface); color: var(--text); font-size: 14px; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.focusbar { flex-wrap: wrap; } .focus-i { display: inline-flex; align-items: center; gap: 1px; }
/* ---------- history ---------- */

function append(el, kids) {
  for (const k of kids) {
    if (k == null || k === false || k === '') continue;
    if (Array.isArray(k)) append(el, k);
    else el.append(k.nodeType ? k : document.createTextNode(String(k)));

  return el;

/** h('div.card.big', {class, style:{}, data:{}, tip, onclick, ...attrs}, ...children) */
function h(spec, props, ...kids) {
  const parts = spec.split('.');

  if (parts.length > 1) el.className = parts.slice(1).join(' ');

    kids.unshift(props);
    props = null;
  }
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className += (el.className ? ' ' : '') + v;
      else if (k === 'style') {
        for (const p in v) {

      } else if (k === 'data') { for (const p in v) if (v[p] != null) el.dataset[p] = v[p]; }
      else if (k === 'tip') el.dataset.tip = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);

      else if (k === 'data') { for (const p in v) el.dataset[p] = v[p]; }
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);

/* ---------------------------------------------------------------------------
 * 02-xlsx.js — minimal, dependency-free, READ-ONLY .xlsx / .xlsm reader.
 *
 * An .xlsx file is a ZIP archive of XML parts. This reader uses only browser
 * built-ins (DecompressionStream for inflate, DOMParser for XML). It extracts
 * cell values (cached formula results included) and merged ranges — nothing
 * else — and never writes anything.
 * ------------------------------------------------------------------------- */

class WorkbookError extends Error {}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new WorkbookError('This browser is too old to read .xlsx files locally (DecompressionStream is missing). Use a current Edge, Chrome or Firefox.');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());

function openZip(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  if (u8.length > 8 && u8[0] === 0xD0 && u8[1] === 0xCF && u8[2] === 0x11 && u8[3] === 0xE0) {
    throw new WorkbookError('This file is not a plain .xlsx workbook. It is either a legacy .xls file or an encrypted workbook (password or sensitivity-label protection). Save an unprotected .xlsx copy and open that.');
  }
  if (u8.length < 22 || dv.getUint32(0, true) !== 0x04034b50) {
    throw new WorkbookError('This file is not an Excel .xlsx workbook (ZIP signature not found).');
  }
  let eocd = -1;
  for (let i = u8.length - 22, min = Math.max(0, u8.length - 22 - 65535); i >= min; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new WorkbookError('The workbook archive is damaged (end of ZIP directory not found).');
  let count = dv.getUint16(eocd + 10, true);
  let cdOff = dv.getUint32(eocd + 16, true);
  const u64 = (p) => dv.getUint32(p, true) + dv.getUint32(p + 4, true) * 4294967296;
  if (count === 0xFFFF || cdOff === 0xFFFFFFFF) { // ZIP64
    const loc = eocd - 20;
    if (loc < 0 || dv.getUint32(loc, true) !== 0x07064b50) throw new WorkbookError('Unsupported ZIP64 archive.');
    const z = u64(loc + 8);
    count = u64(z + 32);
    cdOff = u64(z + 48);
  }
  const utf8 = new TextDecoder('utf-8');
  const entries = new Map();
  let p = cdOff;
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    let compSize = dv.getUint32(p + 20, true);
    let size = dv.getUint32(p + 24, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    let localOff = dv.getUint32(p + 42, true);
    const name = utf8.decode(u8.subarray(p + 46, p + 46 + nameLen));
    if (compSize === 0xFFFFFFFF || size === 0xFFFFFFFF || localOff === 0xFFFFFFFF) {
      let q = p + 46 + nameLen;
      const end = q + extraLen;
      while (q + 4 <= end) {
        const id = dv.getUint16(q, true), len = dv.getUint16(q + 2, true);
        if (id === 1) {
          let r = q + 4;

          if (compSize === 0xFFFFFFFF) { compSize = u64(r); r += 8; }
          if (localOff === 0xFFFFFFFF) { localOff = u64(r); }

        q += 4 + len;
      }

    entries.set(name, { method, compSize, size, localOff, crc: dv.getUint32(p + 16, true), flags: dv.getUint16(p + 8, true) });

    /** All entries in archive order (used to rebuild the archive when editing). */
    list: () => [...entries].map(([name, e]) => ({ name, ...e })),
    /** Compressed bytes of an entry exactly as stored. */

/**
 * Reads a workbook. Returns { sheets: [{ name, hidden, rows: any[][], merges, formulas, uncached, formulasWithoutValue }] }.
 * rows[r][c] holds strings, numbers, booleans or undefined (cached results for formula cells). Merged ranges are filled
 * with their top-left value. `formulas` = Set of "r:c" of every cell with a formula; `uncached` = [r, c] of formula
 * cells without a stored result.

async function readWorkbook(buf) {
  const zip = openZip(buf);

  const rootRels = await zip.xml('_rels/.rels');

    const target = resolvePath(wbPath, r.getAttribute('Target'));

    let rIdx = -1;
    for (const rowEl of kids(doc, 'row')) {
      const rAttr = rowEl.getAttribute('r');
      rIdx = rAttr ? parseInt(rAttr, 10) - 1 : rIdx + 1;
      let cIdx = -1;
      for (const c of rowEl.children) {
        if (c.localName !== 'c') continue;
        const ref = c.getAttribute('r');
        if (ref) cIdx = parseRef(ref).c; else cIdx += 1;
        const t = c.getAttribute('t');
        let vEl = null, isEl = null, fEl = null;
        for (const k of c.children) { if (k.localName === 'v') vEl = k; else if (k.localName === 'is') isEl = k; else if (k.localName === 'f') fEl = k; }

        if (fEl) sheet.formulas.add(rIdx + ':' + cIdx);
        if (t === 'inlineStr') val = isEl ? siText(isEl) : '';

          if (fEl) { sheet.formulasWithoutValue++; sheet.uncached.push([rIdx, cIdx]); }
          continue;
        }
        else {
          const raw = vEl.textContent;
          if (t === 's') val = sst[parseInt(raw, 10)] ?? '';

      if (v == null) continue;
      for (let r = s.r; r <= e.r; r++) for (let c = s.c; c <= e.c; c++) { if (r === s.r && c === s.c) continue; (rows[r] || (rows[r] = []))[c] = v; }
    }
  }
  return { sheets, zip, wbPath };
}
